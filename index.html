<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice Maker | تبدیل متن به صدا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top, #292929, #070707 65%);
            color: white;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: auto;
            padding: 35px 0;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171717;
            border: 1px solid #444;
            border-radius: 22px;
            font-size: 35px;
        }

        h1 {
            margin: 15px 0 5px;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
        }

        .card {
            background: rgba(22, 22, 22, .95);
            border: 1px solid #333;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #444;
            background: #090909;
            color: white;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: white;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #090909;
            color: white;
            font-size: 15px;
        }

        .counter {
            margin-top: 7px;
            color: #777;
            text-align: left;
        }

        .voices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .voice-btn {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #151515;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .voice-btn:hover {
            background: #252525;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 20px;
        }

        .range-title {
            display: flex;
            justify-content: space-between;
            color: #ddd;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button.main,
        .download {
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button.main {
            background: white;
            color: black;
        }

        .download {
            background: #181818;
            color: white;
            border: 1px solid #444;
        }

        .disabled {
            opacity: .4;
            pointer-events: none;
        }

        .player {
            margin-top: 18px;
            padding: 20px;
            border-radius: 18px;
            background: #151515;
            border: 1px solid #333;
        }

        audio {
            width: 100%;
        }

        .status {
            text-align: center;
            color: #aaa;
            margin: 20px 0;
            min-height: 25px;
        }

        footer {
            text-align: center;
            color: #666;
            margin-top: 30px;
        }

        @media(max-width:600px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">🎙️</div>

        <h1>VOICE MAKER</h1>

        <p>
            تبدیل متن به صدای طبیعی با هوش مصنوعی
        </p>
    </header>


    <div class="card">

        <label>📝 متن</label>

        <textarea
            id="text"
            placeholder="متنی که می‌خواهی به صدا تبدیل شود بنویس..."
        ></textarea>

        <div class="counter">
            <span id="counter">0</span> کاراکتر
        </div>

    </div>


    <div class="card">

        <label>🎙️ انتخاب صدا</label>

        <select id="voice">

            <option value="JBFqnCBsd6RMkjVDRZzb">
                👨 مردانه - طبیعی
            </option>

            <option value="EXAVITQu4vr4xnSDxMaL">
                👨 مردانه - جوان
            </option>

            <option value="21m00Tcm4TlvDq8ikWAM">
                👩 زنانه - طبیعی
            </option>

        </select>


        <div class="voices">

            <button
                class="voice-btn"
                onclick="setCharacter('cartoon')">
                🧽 کارتونی
            </button>

            <button
                class="voice-btn"
                onclick="setCharacter('funny')">
                😂 بامزه
            </button>

            <button
                class="voice-btn"
                onclick="setCharacter('villain')">
                😈 شرور
            </button>

            <button
                class="voice-btn"
                onclick="setCharacter('hero')">
                🦸 قهرمان
            </button>

        </div>

    </div>


    <div class="card">

        <div class="range-title">
            <span>⚡ سرعت</span>
            <span id="speedText">1.00</span>
        </div>

        <input
            id="speed"
            type="range"
            min="0.7"
            max="1.3"
            step="0.05"
            value="1"
        >


        <div class="range-title">
            <span>🎭 حالت صدا</span>
            <span id="styleText">0.00</span>
        </div>

        <input
            id="style"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0"
        >


        <div class="range-title">
            <span>🎚️ ثبات</span>
            <span id="stabilityText">0.50</span>
        </div>

        <input
            id="stability"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.5"
        >

    </div>


    <div class="actions">

        <button
            class="main"
            id="generate"
            onclick="generateVoice()">
            🎙️ ساخت صدا
        </button>

        <a
            id="download"
            class="download disabled"
            download="voice.mp3">
            💾 دانلود MP3
        </a>

    </div>


    <div
        id="playerBox"
        class="player"
        style="display:none;">

        <h3>🔊 صدای ساخته‌شده</h3>

        <audio
            id="audio"
            controls>
        </audio>

    </div>


    <div
        id="status"
        class="status">
    </div>


    <footer>
        Voice Maker • AI Text To Speech
    </footer>

</div>


<script>

const text = document.getElementById("text");
const counter = document.getElementById("counter");

const speed = document.getElementById("speed");
const style = document.getElementById("style");
const stability = document.getElementById("stability");

const speedText = document.getElementById("speedText");
const styleText = document.getElementById("styleText");
const stabilityText =
    document.getElementById("stabilityText");


text.addEventListener("input", () => {

    counter.textContent =
        text.value.length;

});


speed.addEventListener("input", () => {

    speedText.textContent =
        Number(speed.value).toFixed(2);

});


style.addEventListener("input", () => {

    styleText.textContent =
        Number(style.value).toFixed(2);

});


stability.addEventListener("input", () => {

    stabilityText.textContent =
        Number(stability.value).toFixed(2);

});


function setCharacter(type) {

    if (type === "cartoon") {

        speed.value = 1.05;
        style.value = .9;
        stability.value = .35;

    }

    if (type === "funny") {

        speed.value = 1.15;
        style.value = 1;
        stability.value = .25;

    }

    if (type === "villain") {

        speed.value = .85;
        style.value = .75;
        stability.value = .65;

    }

    if (type === "hero") {

        speed.value = .95;
        style.value = .55;
        stability.value = .6;

    }

    speed.dispatchEvent(new Event("input"));
    style.dispatchEvent(new Event("input"));
    stability.dispatchEvent(new Event("input"));
}


async function generateVoice() {

    const textValue =
        text.value.trim();

    const voice =
        document.getElementById("voice").value;

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("generate");

    const download =
        document.getElementById("download");

    const audio =
        document.getElementById("audio");

    const playerBox =
        document.getElementById("playerBox");


    if (!textValue) {

        status.textContent =
            "❌ اول متن را وارد کن.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "⏳ در حال ساخت صدا...";

    status.textContent =
        "در حال تولید صدای طبیعی...";


    try {

        const response = await fetch(
            "/api/tts",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    text: textValue,

                    voiceId: voice,

                    speed:
                        Number(speed.value),

                    stability:
                        Number(stability.value),

                    similarity: .75,

                    style:
                        Number(style.value)

                })
            }
        );


        if (!response.ok) {

            const error =
                await response.json();

            throw new Error(
                error.error ||
                "خطا در ساخت صدا"
            );
        }


        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);


        audio.src = url;

        playerBox.style.display =
            "block";


        download.href = url;

        download.download =
            "voice-" +
            Date.now() +
            ".mp3";

        download.classList.remove(
            "disabled"
        );


        status.textContent =
            "✅ صدا آماده شد!";


    } catch (error) {

        status.textContent =
            "❌ " + error.message;

    }


    button.disabled = false;

    button.textContent =
        "🎙️ ساخت صدا";
}

</script>

</body>
  </html>
